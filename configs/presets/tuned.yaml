# Implementation and optimizer settings of the tuning runs (configs/experiments/*/tuned_*.yaml), where they
# differ from base.yaml: TRM-style post-norm blocks with parameter-free RMSNorm and proposer/refiner blocks of
# equal width, fixed shared initial refiner states, L0 rows rescaled to the decoder's embedding norm, fp32
# modules with the decoder prefix KV-cached (no gradient checkpointing), AdamW betas (0.9, 0.95) without
# weight decay, and a cosine schedule with warmup in steps and a 10% floor.
model:
  block_norm: post
  final_norm: false
  proposer: {mlp_hidden: 1024, shell_rescale: true}
  refiner: {mlp_hidden: 1024, init_state: fixed, init_state_shape: shared}
train:
  precision: fp32
  grad_ckpt: false
  prefix_cache: true
stage1: {lr: 3.0e-4, betas: [0.9, 0.95], weight_decay: 0.0, min_lr_ratio: 0.1}
stage2: {lr: 3.0e-4, betas: [0.9, 0.95], weight_decay: 0.0, min_lr_ratio: 0.1}
