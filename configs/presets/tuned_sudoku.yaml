# Sudoku schedule and data defaults of the tuning runs (use together with tuned.yaml).
data:
  pipelines:
    symmetry_reveal_stage2:
      - {step: symmetry}
      - {step: reveal, min_start: 0.0, min_end: 0.0, max_start: 0.8, max_end: 0.4, ramp_frac: 0.5, p_none: 0.4}
train: {batch_size: 16, log_every: 25, eval_every: 500, eval_holdout_n: 256, gen_eval_n: 0}
stage1: {epochs: 6, warmup_steps: 300, pipeline: symmetry_reveal}
stage2: {epochs: 4, warmup_steps: 300, pipeline: symmetry_reveal_stage2}
