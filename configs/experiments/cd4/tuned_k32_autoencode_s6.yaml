# Tuning run: stage 2 with S = 6 on tuned_k32_autoencode's last stage-1 checkpoint.
task: cd4
extends: [../../presets/tuned.yaml, ../../presets/tuned_cd4.yaml]
model: {K_infer: 32, lambda_delta: 1.0e-3, refiner: {S: 6}}
train: {eval_every: 250, eval_holdout_n: 128, eval_aug_n: 128, gen_eval_n: 128, gen_max_new_tokens: 96}
stage1: {steps: 3000, lr: 1.0e-3, warmup_steps: 200, pipeline: autoencode}
stage2: {stage1_from: tuned_k32_autoencode, stage1_ckpt: last, steps: 6000, lr: 3.0e-4, warmup_steps: 300, pipeline: none}
