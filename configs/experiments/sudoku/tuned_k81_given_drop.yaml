# Tuning run: stage 1 with decoder-side given dropout (the proposer always sees the full puzzle).
task: sudoku
extends: [../../presets/tuned.yaml, ../../presets/tuned_sudoku.yaml]
model: {K_train: 81, K_infer: 81}
train: {eval_every: 500, eval_holdout_n: 128, eval_aug_n: 128}
stage1: {steps: 6000, lr: 1.0e-3, warmup_steps: 200, pipeline: symmetry_given_drop}
