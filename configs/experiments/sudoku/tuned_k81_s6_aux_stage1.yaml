# Tuning run: stage 2 on tuned_k81_s6_aux's proposer trained by the decoder CE alone (no auxiliary readout);
# batch 16 per GPU, meant for 2 GPUs (scripts/train.sh with GPUS=a,b).
task: sudoku
extends: [../../presets/tuned.yaml, ../../presets/tuned_sudoku.yaml]
model: {K_train: 81, K_infer: 81, lambda_delta: 1.0e-4, refiner: {S: 6}}
train: {batch_size: 16, eval_every: 500, eval_holdout_n: 64, gen_eval_n: 0}
stage1:                         # identical to tuned_k81_s6_aux (reused below through stage1_from)
  steps: 3000
  lr: 1.0e-3
  warmup_steps: 300
  pipeline: symmetry
  batch_size: 128
  aux_readout: {weight: 1.0, ce_batch: 16, ce_every: 4}
stage2:
  stage1_from: tuned_k81_s6_aux
  steps: 6000
  lr: 1.0e-3
  warmup_steps: 500
  weight_decay: 0.1
  pipeline: symmetry
  aux_readout: {weight: 0.0}
