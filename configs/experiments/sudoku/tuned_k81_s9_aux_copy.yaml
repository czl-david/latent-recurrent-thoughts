# Tuning run: stage 1 learns a copy of the puzzle (autoencoding + auxiliary readout); stage 2 with S = 9,
# weight decay 0.1 and an EMA of the refiner.
task: sudoku
extends: [../../presets/tuned.yaml, ../../presets/tuned_sudoku.yaml]
model: {K_train: 81, K_infer: 81, lambda_delta: 1.0e-4, refiner: {S: 9}}
train: {batch_size: 128, eval_every: 500, eval_holdout_n: 64, gen_eval_n: 0, eval_aug_n: 64}
stage1:
  steps: 1500
  lr: 1.0e-3
  warmup_steps: 300
  pipeline: symmetry_autoencode
  select_by: shuffle_gap_aug
  aux_readout: {weight: 1.0, ce_batch: 16, ce_every: 4}
stage2:
  steps: 15000
  lr: 1.0e-3
  warmup_steps: 500
  weight_decay: 0.1
  ema_decay: 0.999
  pipeline: symmetry
  aux_readout: {weight: 1.0, ce_batch: 16, ce_every: 4}
