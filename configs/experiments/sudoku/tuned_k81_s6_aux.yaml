# Tuning run: one latent per cell, S = 6, lighter residual penalty; auxiliary readout (weight 1) in both
# stages, batch 128 with the decoder CE on 16 rows every 4th step.
task: sudoku
extends: [../../presets/tuned.yaml, ../../presets/tuned_sudoku.yaml]
model: {K_train: 81, K_infer: 81, lambda_delta: 1.0e-4, refiner: {S: 6}}
train: {batch_size: 128, eval_every: 500, eval_holdout_n: 64, gen_eval_n: 0}
stage1:
  steps: 3000
  lr: 1.0e-3
  warmup_steps: 300
  pipeline: symmetry
  aux_readout: {weight: 1.0, ce_batch: 16, ce_every: 4}
stage2:
  steps: 15000
  lr: 1.0e-3
  warmup_steps: 500
  pipeline: symmetry
  aux_readout: {weight: 1.0, ce_batch: 16, ce_every: 4}
